<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html
    SetEnv PERL5LIB /var/www/html
    Header append Access-Control-Allow-Origin "*"
    AllowEncodedSlashes NoDecode

    RewriteEngine On

    # Canonicalize query parameters before MultiViews selects index.cgi.en/ja.
    RewriteCond  %{HTTP:X-Forwarded-Proto}  =https
    RewriteCond  %{QUERY_STRING}  ^lang=(en|ja)&spe=(hs|mm|rn|gg|xt|dr|ci|dm|ce|at|os|sc|sp|zoo)&format=(html|txt|json)$  [NC]
    RewriteRule  ^/(en|ja)/([^/]+)$  https://%{HTTP_HOST}/%1/%2/$2.%3?  [R,L,NE]
    RewriteCond  %{HTTP:X-Forwarded-Proto}  =https
    RewriteCond  %{QUERY_STRING}  ^lang=(en|ja)&spe=(hs|mm|rn|gg|xt|dr|ci|dm|ce|at|os|sc|sp|zoo)&format=(html|txt|json)$  [NC]
    RewriteRule  ^/test/(en|ja)/([^/]+)$  https://%{HTTP_HOST}/test/%1/%2/$2.%3?  [R,L,NE]
    RewriteCond  %{QUERY_STRING}  ^lang=(en|ja)&spe=(hs|mm|rn|gg|xt|dr|ci|dm|ce|at|os|sc|sp|zoo)&format=(html|txt|json)$  [NC]
    RewriteRule  ^/(en|ja)/([^/]+)$  /%1/%2/$2.%3?  [R,L,NE]
    RewriteCond  %{QUERY_STRING}  ^lang=(en|ja)&spe=(hs|mm|rn|gg|xt|dr|ci|dm|ce|at|os|sc|sp|zoo)&format=(html|txt|json)$  [NC]
    RewriteRule  ^/test/(en|ja)/([^/]+)$  /test/%1/%2/$2.%3?  [R,L,NE]

    RewriteCond  %{HTTP:X-Forwarded-Proto}  =https
    RewriteCond  %{QUERY_STRING}  (^|&)lang=(en|ja)(&|$)  [NC]
    RewriteRule  ^/(?:en|ja)/?$  https://%{HTTP_HOST}/%2/?  [R,L]
    RewriteCond  %{HTTP:X-Forwarded-Proto}  =https
    RewriteCond  %{QUERY_STRING}  (^|&)lang=(en|ja)(&|$)  [NC]
    RewriteRule  ^/test/(?:en|ja)/?$  https://%{HTTP_HOST}/test/%2/?  [R,L]
    RewriteCond  %{QUERY_STRING}  (^|&)lang=(en|ja)(&|$)  [NC]
    RewriteRule  ^/(?:en|ja)/?$  /%2/?  [R,L]
    RewriteCond  %{QUERY_STRING}  (^|&)lang=(en|ja)(&|$)  [NC]
    RewriteRule  ^/test/(?:en|ja)/?$  /test/%2/?  [R,L]

    RewriteCond  %{HTTP:X-Forwarded-Proto}  =https
    RewriteCond  %{QUERY_STRING}  ^spe=(hs|mm|rn|gg|xt|dr|ci|dm|ce|at|os|sc|sp|zoo)$  [NC]
    RewriteRule  ^/$  https://%{HTTP_HOST}/%1/?  [R,L]
    RewriteCond  %{HTTP:X-Forwarded-Proto}  =https
    RewriteCond  %{QUERY_STRING}  ^spe=(hs|mm|rn|gg|xt|dr|ci|dm|ce|at|os|sc|sp|zoo)$  [NC]
    RewriteRule  ^/test/?$  https://%{HTTP_HOST}/test/%1/?  [R,L]
    RewriteCond  %{QUERY_STRING}  ^spe=(hs|mm|rn|gg|xt|dr|ci|dm|ce|at|os|sc|sp|zoo)$  [NC]
    RewriteRule  ^/$  /%1/?  [R,L]
    RewriteCond  %{QUERY_STRING}  ^spe=(hs|mm|rn|gg|xt|dr|ci|dm|ce|at|os|sc|sp|zoo)$  [NC]
    RewriteRule  ^/test/?$  /test/%1/?  [R,L]

    DirectoryIndex index.pl index.cgi index.cgi.en index.html
    <Directory /var/www/html>
        Options ExecCGI FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
        AddHandler cgi-script .cgi .pl
    </Directory>


    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
